---
################################################################################
# range42 — inventory example
#
# This inventory targets the BOOTSTRAPPING hosts:
#   - proxmox: the Proxmox hypervisor (API access, not SSH)
#   - deployer-cli: the operator workstation where range42 tools run
#
# This is NOT the scenario inventory (VMs like admin-wazuh, student-box, etc.)
# The scenario inventory lives in range42-playbooks/scenarios/<scenario>/
#
# Usage:
#   1. Copy this directory: cp -r inventories/example inventories/<your-codename>
#   2. Edit hosts.yml with your Proxmox and deployer-cli addresses
#   3. Edit group_vars/all/vars.yml with your infrastructure settings
#   4. Edit group_vars/<scenario>/vars.yml with your scenario settings
#   5. Create group_vars/<scenario>/vault.yml from vault.yml.example
#
################################################################################

all:
  children:

    #### proxmox hypervisor — accessed via API (not SSH)
    proxmox:
      hosts:
        # replace with your CODENAME
        ds-px-off-black-pxtesting:
          ansible_host: "ds-px-off-black-pxtesting.skate-eagle.ts.net:8006"
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3

    #### deployer-cli — the operator workstation
    deployer_cli:
      hosts:
        # replace with your deployer-cli connection details
        deployer-cli:
          ansible_host: "127.0.0.1"
          ansible_port: 22
          ansible_user: "grml"
          # if deployer-cli is localhost (127.0.0.1), use local connection
          ansible_connection: local
