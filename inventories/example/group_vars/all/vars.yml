---
################################################################################
# range42 — shared variables (all scenarios of this CODENAME)
#
# These variables are common to ALL scenarios running on the same
# Proxmox infrastructure. They go here, not in the scenario-specific vars.
#
# For scenario-specific variables → group_vars/<scenario>/vars.yml
# For secrets → group_vars/<scenario>/vault.yml
# For terminology → see GLOSSARY.md at the root of this repository
#
################################################################################


#### INFRASTRUCTURE IDENTIFICATION ####

# A short name that identifies your Proxmox server.
# This name is used everywhere: directory names, SSH config, key names.
# Pick something meaningful to you. No spaces, no special characters.
#
# examples:
#   "hv-lab-01"                        — simple lab server
#   "lab-proxmox-01"                   — detailed naming
#   "proxmox-home"                     — home server
#
INFRASTRUCTURE_CODENAME: "to_define"

# The address of your Proxmox server.
# Can be an IP, a hostname, or a Tailscale FQDN.
#
# examples:
#   "192.168.1.100"
#   "proxmox.local"
#   "my-server.tailnet-name.ts.net"
#
INFRASTRUCTURE_PROXMOX_ADDRESS: "to_define"


#### PROXMOX SETTINGS ####

# The exact node name as shown in the Proxmox web UI (top-left, under Datacenter).
# This MUST match exactly — check in Proxmox: Datacenter → your node name.
#
# example: "pve", "proxmox", "px-testing"
#
proxmox_node: "to_define"

# Storage names — check in Proxmox: Datacenter → Storage.
# iso storage: where cloud-init images (.img) are stored
# vm storage: where virtual machine disks are stored
# The defaults below work for most standard Proxmox installs.
#
infrastructure_proxmox_dest_iso_storage_name: "local"
infrastructure_proxmox_dest_vm_storage_name: "local-lvm"

# The outbound network interface on your Proxmox server (for NAT).
# On most Proxmox setups this is "vmbr0" (the default bridge with internet).
# Check with: ip route | grep default
#
# common values: "vmbr0" (most Proxmox), "enp3s0" (bare metal without bridge)
#
infrastructure_proxmox_default_network_card_interface: "vmbr0"

# The Proxmox bridge that VMs will be connected to.
# demo_lab uses 192.168.142.0/24 on this bridge.
# This bridge must exist on the Proxmox server before deploying VMs.
#
vm_net_virtio_bridge: "vmbr142"


#### PROXMOX API ACCESS ####

# The Proxmox API is used by Ansible to create/manage VMs.
# If this is your first setup, leave these as "to_define".
# The playbook 02_configure_proxmox.yml will create the user and token.
#
# After the first run, fill these in so subsequent runs can reuse them.
#
# proxmox_api_host format: "address:port" (default Proxmox port is 8006)
# proxmox_api_user format: "username@pam" (PAM authentication)
#
# examples:
#   proxmox_api_host: "192.168.1.100:8006"
#   proxmox_api_user: "range42_api@pam"
#   proxmox_api_token_id: "range42_api_token"
#
proxmox_api_host: "{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}:8006"
proxmox_api_user: "range42_api@pam"
proxmox_api_token_id: "r42_{{ INFRASTRUCTURE_CODENAME }}_{{ INFRASTRUCTURE_SCENARIO }}"
# proxmox_api_token_secret → in vault.yml (secret)


#### JUMP HOST ####

# The lab VMs run on a private network (192.168.142.x on vmbr142 by default).
# They are NOT directly reachable from your machine.
# SSH uses a "jump host" to reach them — it connects to the Proxmox
# server first, then bounces to the target VM:
#
#   [you] --SSH--> [Proxmox / jump_user] --SSH--> [VM on private network]
#
# This is automatic — SSH handles it via ProxyJump in the config.
# You just type: ssh r42.admin-wazuh (and it goes through the jump).
#
# jump_on_proxmox: YES means the jump user lives on the Proxmox server
#                  (this is the most common setup)
#
jump_on_proxmox: "YES"

# jump host connection — usually same as INFRASTRUCTURE_PROXMOX_ADDRESS
jump_host: "{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}"
jump_user: "jump_user"
jump_port: "22"
# jump_password → in vault.yml (secret)


#### DEPLOYER-CLI ####

# The deployer-cli is the machine where you run the lab playbooks.
# It can be your laptop, a VM, or the same machine running Ansible.
#
# DEPLOYER_CLI_USER: the Linux user on that machine
# deployer_cli_ip: "127.0.0.1" means localhost (you're running Ansible locally)
#                  change to the actual IP if the deployer-cli is a remote VM
#
# example for remote deployer:
#   DEPLOYER_CLI_USER: "operator"
#   deployer_cli_ip: "192.168.1.50"
#
DEPLOYER_CLI_USER: "your_deployer_cli_username"
deployer_cli_ip: "127.0.0.1"
deployer_cli_ssh_port: "22"

# Where range42 git repos are cloned on the deployer-cli.
# Default: ~/range42/
#
DEPLOYER_CLI__DST_GIT_DIR: "/home/your_deployer_cli_username/range42/"

# Where workspace configs are stored on the deployer-cli.
# Default: ~/range42.config/
# Each workspace is a subdirectory: <config_dir>/<codename>-<scenario>/
#
DEPLOYER_CLI__DST_CONFIG_BASE_DIR: "/home/your_deployer_cli_username/range42.config"


#### WORKSTATION (LOCAL) ####

# Your local SSH config directory — on YOUR machine, not the deployer-cli.
# This is used by prepare scripts to configure your local SSH client.
# Default: ~/.ssh
#
ssh_client__dst_config_dir: "/home/your_deployer_cli_username/.ssh"


#### GIT ####

# Git branch to clone for all range42 repos.
# Use "main" unless you're testing a specific branch.
#
GIT_BRANCH: "main"


#### PACKAGES ####

# Install system packages on the deployer-cli (YES/NO).
# Set to NO if the deployer-cli already has everything installed
# and you just want to update the workspace.
#
DEV_MODE_INSTALL_JUMP_HOST_ANSIBLE_PACKAGES: "YES"


#### APT PROXY (OPTIONAL) ####

# apt-cacher-ng or similar HTTP proxy URL for apt-get traffic.
# When set, applied at multiple layers:
#   - on the deployer-cli (deployer.bootstrap, before any apt install)
#   - on the Proxmox host (cloud-init cicustom snippet for VM templates)
#   - on lab VMs (via cloud-init vendor-data, inherited from templates)
#
# Format: full URL with protocol AND port
#   e.g. "http://192.168.1.50:3142"   (apt-cacher-ng default port)
#   e.g. "http://192.168.1.100:80"    (proxy on port 80)
#
# Leave empty to disable. Wizard validates format + reachability.
#
apt_proxy_url: ""


#### APT MIRROR (OPTIONAL) ####

# Managed by the wizard — do not edit manually.
# Set via range42-init.py to deploy a local APT mirror VM automatically.
#
# apt_mirror_airgapped: false = apt-cacher-ng caching proxy mode
#                              → apt_mirror_port (3142) is used as the proxy port
#                       true  = apt-mirror full offline mirror (~200 GB), served
#                              via nginx directly (no apt-cacher-ng)
#                              → apt_mirror_port is IGNORED in this mode;
#                                apt_mirror_http_port (80) applies instead
#
apt_mirror_enabled: false
apt_mirror_vm_ip: "192.168.142.50"
apt_mirror_port: 3142  # used only in proxy mode (apt_mirror_airgapped: false)
apt_mirror_vm_id: 1050
apt_mirror_vm_template_id: 9301
apt_mirror_airgapped: false
apt_mirror_prewarm: false
apt_mirror_persistent: false
apt_mirror_fallback: true
apt_mirror_debian_stable: true
apt_mirror_ubuntu_2204: false
apt_mirror_ubuntu_2404: false
apt_mirror_backports: true
apt_mirror_security: true
apt_mirror_vm_disk_size: "500G"


#### PASSWORD FORMAT ####
# All passwords, secrets, API tokens must use ONLY: a-z A-Z 0-9 - _
# AVOID: $ { } \ ! % @ * " ' < > | & and spaces
# These characters break YAML, Jinja2, shell quoting, and cloud-init.
# Recommended length: 20+ characters.
