name: SSH transport

'on':
  pull_request:
    paths:
      - '.github/workflows/ssh-transport.yml'
      - 'ansible.cfg'
      - 'roles/deployer.bootstrap/templates/ansible.cfg.j2'
      - 'roles/deployer.bootstrap/files/range42-context.sh'
      - 'tests/test_ssh_transport_bounds.py'
      - 'tests/test_context_runner_links.py'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ssh-transport.yml'
      - 'ansible.cfg'
      - 'roles/deployer.bootstrap/templates/ansible.cfg.j2'
      - 'roles/deployer.bootstrap/files/range42-context.sh'
      - 'tests/test_ssh_transport_bounds.py'
      - 'tests/test_context_runner_links.py'

permissions:
  contents: read

concurrency:
  group: ssh-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Native Ubuntu CLI and the participant API image respectively.
        ansible-core: ['2.16.3', '2.19.1']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install local shell dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh openssh-client
      - name: Install local test dependencies
        run: >-
          python -m pip install
          'ansible-core==${{ matrix.ansible-core }}' 'pytest==8.3.4'
          'PyYAML==6.0.3' 'cryptography==46.0.5' 'paramiko==3.5.1'
      - name: Exercise SSH transport bounds and context ownership
        run: >-
          python -m pytest -q
          tests/test_ssh_transport_bounds.py
          tests/test_context_runner_links.py
