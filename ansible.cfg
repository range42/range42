[defaults]
# default inventory — override with -i for specific CODENAME
inventory = ./inventories/example/hosts.yml

# roles path — use both relative to ansible.cfg AND playbooks subdir
# this ensures roles are found whether running from root or from playbooks/
roles_path = roles:playbooks/../roles

# vault password file — override with --vault-password-file for specific CODENAME-SCENARIO
# vault_password_file =

# output — debug mode ON by default (skipped tasks + full ok/failed details visible)
# the custom no_skipped callback plugin has bugs (lost error messages on item failures),
# so we default to Ansible's built-in output. Toggle via: range42-context debug
#
# stdout_callback = no_skipped
# callback_plugins = callback_plugins
#
#
#

# suppress noisy warnings
deprecation_warnings = False
command_warnings = False

# allow dots and hyphens in host/group names (r42.admin-wazuh etc.)
force_valid_group_names = ignore

# ssh settings
host_key_checking = False
timeout = 30

[privilege_escalation]
become = false

[ssh_connection]
pipelining = True
