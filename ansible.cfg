[defaults]
# default inventory — override with -i for specific CODENAME
inventory = ./inventories/example/hosts.yml

# roles path — use both relative to ansible.cfg AND playbooks subdir
# this ensures roles are found whether running from root or from playbooks/
roles_path = roles:playbooks/../roles

# vault password file — override with --vault-password-file for specific CODENAME-SCENARIO
# vault_password_file =

# output : the readable one by default. no_skipped is Ansible's own output minus the tasks that
# every host skips, their banner included, so a role full of conditional includes stops flooding
# the screen with empty headers. It never touches an error : a failed task, a failed item of a
# loop and the reason of an assert are printed exactly as the built-in output prints them.
#
# THE TWO LINES BELOW ARE A SWITCH, DO NOT EDIT THEM BY HAND :
#   range42-context debug-on    comments them out, and every run prints the full ansible log
#   range42-context debug-off   puts them back, and a run prints what it says and its failures
#   range42-context debug       says which of the two is active
# The same state also decides what a gesture launched from range42-context prints.
#
# callback_plugins is relative, so it resolves only for a run started from this directory ;
# range42-context use exports ANSIBLE_CALLBACK_PLUGINS with the absolute path, which covers the
# runs started anywhere else.
stdout_callback = no_skipped
callback_plugins = callback_plugins

# suppress noisy warnings
deprecation_warnings = False
command_warnings = False

# Keep group names with hyphens intact (e.g. proxmox-cli, r42.admin-wazuh).
#
# DO NOT change to "silently", "warn", or "ignore" — those values silently
# RENAME groups with hyphens to underscores (proxmox-cli -> proxmox_cli).
# Plays referencing `hosts: proxmox-cli` then match 0 hosts and the entire
# play is silently skipped ("no hosts matched"), with no error surfaced.
# We hit this in May 2026: all scenario deploys silently no-op'd the
# cloud-init disk import step. Templates were built without a disk and
# every cloned VM was unbootable.
#
# "never" = leave group names as-is, period.
force_valid_group_names = never

# ssh settings
host_key_checking = False
timeout = 30

# ─── perf tuning ─────────────────────────────────────────────────────────

# forks — max VMs processed in parallel per task
# default: 5
# ~5x faster on 10+ VM labs, ~2 GB RAM peak on the deployer
forks = 25

# gathering — "smart" avoids re-gathering facts already collected in this run
# default: implicit (re-gathers at every play of the same run)
# DISABLED: caused wazuh-indexer "Hashing the custom admin password" task to fail
# (some roles depend on facts being re-gathered between plays)
# gathering = smart

[privilege_escalation]
become = false

[ssh_connection]
# pipelining — pass the Python module via SSH stdin instead of 3 SSH calls per task
# default: False
# ~3x fewer RTT per task
pipelining = True

# note: Ansible already enables ControlMaster by default via ssh_args
#   (-C -o ControlMaster=auto -o ControlPersist=60s)
# → SSH TCP connection is reused between tasks on the same VM, no override needed
