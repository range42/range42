---
# configuration.validate — fail early if required variables are not configured
#
# runs at the beginning of site.yml before any other role
# catches "to_define" placeholders left in the inventory
#
# this saves users from cryptic failures 10 minutes into the deployment

- name: VALIDATE - CHECK REQUIRED VARIABLES
  ansible.builtin.assert:
    that:
      - item.value != "to_define"
      - item.value != "your_deployer_cli_username"
    fail_msg: |

      #### #### #### #### #### #### #### #### #### #### ####

      MISSING CONFIGURATION: {{ item.name }}

      The variable "{{ item.name }}" has not been configured.
      Please edit your inventory file:

        inventories/<your-codename>/group_vars/all/vars.yml

      Or run the wizard:

        python3 range42-init.py

      #### #### #### #### #### #### #### #### #### #### ####
    quiet: true
  loop:
    - { name: "INFRASTRUCTURE_CODENAME",        value: "{{ INFRASTRUCTURE_CODENAME | default('to_define') }}" }
    - { name: "INFRASTRUCTURE_SCENARIO",         value: "{{ INFRASTRUCTURE_SCENARIO | default('to_define') }}" }
    - { name: "INFRASTRUCTURE_PROXMOX_ADDRESS",  value: "{{ INFRASTRUCTURE_PROXMOX_ADDRESS | default('to_define') }}" }
    - { name: "proxmox_node",                    value: "{{ proxmox_node | default('to_define') }}" }
    - { name: "DEPLOYER_CLI_USER",               value: "{{ DEPLOYER_CLI_USER | default('your_deployer_cli_username') }}" }
  loop_control:
    label: "{{ item.name }}"

- name: VALIDATE - CHECK SCENARIO TEMPLATES DIR EXISTS
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.fileglob', SCENARIO_TEMPLATES_DIR ~ '/*.j2') | length > 0
        or lookup('ansible.builtin.fileglob', SCENARIO_TEMPLATES_DIR ~ '/*.yml') | length > 0
    fail_msg: |

      #### #### #### #### #### #### #### #### #### #### ####

      MISSING SCENARIO TEMPLATES: {{ SCENARIO_TEMPLATES_DIR }}

      The scenario templates directory is empty or does not exist.
      This usually means the range42-playbooks sibling repo is missing.

      Clone it alongside the range42 repo:

        cd {{ playbook_dir }}/../../..
        git clone https://github.com/range42/range42-playbooks.git

      #### #### #### #### #### #### #### #### #### #### ####
    quiet: true
  when:
    - SCENARIO_TEMPLATES_DIR is defined
    - SCENARIO_TEMPLATES_DIR != "to_define"
