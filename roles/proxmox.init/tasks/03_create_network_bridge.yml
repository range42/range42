---
# proxmox init - LEGACY lab bridges (vmbr140-vmbr150), gated by INIT_LEGACY_BRIDGES
#
# DISABLED BY DEFAULT on this branch, maintainer decision 2026-09-04 : the SDN scenarios own
# their networks (zones, vnets, subnets and SNAT come from sdn_network.bootstrap, per
# scenario). An infrastructure meant for the NON-migrated scenarios re-enables this whole
# file with -e INIT_LEGACY_BRIDGES=YES - the when: sits on the import in main.yml.
#
# uses pvesh to create bridges (visible in Proxmox web UI)
# injects NAT post-up/post-down rules for bridges with nat: true
#
# KNOWN LIMITATION, documented and DELIBERATELY not auto-tolerated : the existence check
# below can miss a bridge the node really has (seen live : vmbr143 existed, was not
# skipped, and pvesh answered "iface: interface already exists", rc 255, killing the run).
# Tolerating that answer would also silence a bridge existing with a DIVERGENT config,
# and a divergent bridge must keep failing loudly. Fix it only with a legacy bench to
# measure against.
#
# ip forwarding and the network reload used to live here : moved to 03_ip_forwarding.yml,
# ALWAYS played - both modes need routing.

- name: PROXMOX INIT - CHECK EXISTING BRIDGES
  ansible.builtin.shell: >
    ssh root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
    "pvesh get /nodes/{{ proxmox_node }}/network --type bridge 2>/dev/null | grep -oP 'vmbr1[45]\d' | sort -u || true"
  register: existing_bridges
  changed_when: false

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: PROXMOX INIT - CREATE LAB BRIDGES
  ansible.builtin.shell: >
    ssh root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
    "pvesh create /nodes/{{ proxmox_node }}/network
    --iface {{ item.name }}
    --type bridge
    --address {{ item.ip }}
    --netmask 255.255.255.0
    --autostart 1
    --comments 'range42 lab network'"
  when: item.name not in existing_bridges.stdout
  loop: "{{ range42_lab_bridges }}"
  register: bridges_created
  changed_when: item.name not in existing_bridges.stdout

- name: PROXMOX INIT - APPLY NETWORK CONFIGURATION
  ansible.builtin.shell: >
    ssh root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
    "pvesh set /nodes/{{ proxmox_node }}/network"
  when: bridges_created.changed | default(false)

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: PROXMOX INIT - UPLOAD NAT INJECT SCRIPT
  ansible.builtin.shell: >
    scp {{ role_path }}/files/inject_nat_rules.sh
    root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}:/tmp/inject_nat_rules.sh &&
    ssh root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }} "chmod +x /tmp/inject_nat_rules.sh"
  changed_when: true

- name: PROXMOX INIT - RENDER NAT RULES FOR ENABLED BRIDGES
  ansible.builtin.template:
    src: bridge_nat_rules.j2
    dest: "/tmp/range42_nat_{{ item.name }}.txt"
    mode: "0644"
  vars:
    bridge_ip: "{{ item.ip }}"
  loop: "{{ range42_lab_bridges | selectattr('nat') | list }}"

- name: PROXMOX INIT - UPLOAD AND INJECT NAT (ENABLED BRIDGES)
  ansible.builtin.shell: >
    scp /tmp/range42_nat_{{ item.name }}.txt
    root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}:/tmp/range42_nat_{{ item.name }}.txt &&
    ssh root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
    "/tmp/inject_nat_rules.sh {{ item.name }} /tmp/range42_nat_{{ item.name }}.txt"
  loop: "{{ range42_lab_bridges | selectattr('nat') | list }}"
  changed_when: true

- name: PROXMOX INIT - REMOVE NAT (DISABLED BRIDGES)
  ansible.builtin.shell: >
    ssh root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
    "/tmp/inject_nat_rules.sh {{ item.name }} REMOVE"
  loop: "{{ range42_lab_bridges | rejectattr('nat') | list }}"
  changed_when: true

- name: PROXMOX INIT - CLEAN UP LOCAL NAT TEMP FILES
  ansible.builtin.file:
    path: "/tmp/range42_nat_{{ item.name }}.txt"
    state: absent
  loop: "{{ range42_lab_bridges | selectattr('nat') | list }}"

- name: PROXMOX INIT - CLEAN UP REMOTE INJECT SCRIPT
  ansible.builtin.shell: >
    ssh root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
    "rm -f /tmp/inject_nat_rules.sh"
  changed_when: true

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: PROXMOX INIT - DISPLAY BRIDGE STATUS
  ansible.builtin.debug:
    msg: |

      #### #### #### #### #### #### #### #### #### #### ####

      Network bridges: vmbr140 — vmbr150 (range42 lab networks)
      NAT enabled on: {{ range42_lab_bridges | selectattr('nat') | map(attribute='name') | join(', ') }}
      NAT outbound: via {{ infrastructure_proxmox_default_network_card_interface }}
      IP forwarding: enabled

      #### #### #### #### #### #### #### #### #### #### ####
