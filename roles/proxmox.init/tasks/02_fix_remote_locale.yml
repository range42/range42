---
# proxmox init - fix locale on proxmox server (set C.UTF-8)
#
# uses ssh root@proxmox directly (same as original bash script)
# delegate_to doesn't work well here because ansible connects as
# the inventory user, not as root
#
# source: proxmox_fix_remote_locale() lines 946-979

# minimal Proxmox images may not ship with the `locales` package — without it
# locale-gen fails silently. mirrors deployer.bootstrap/02_locale.yml fix (PR #80).
- name: PROXMOX INIT - INSTALL locales PACKAGE ON PROXMOX (REQUIRED FOR locale-gen)
  ansible.builtin.shell: >
    ssh root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
    "apt-get update -qq && apt-get install -y locales"
  changed_when: true

- name: PROXMOX INIT - SET /ETC/DEFAULT/LOCALE TO {{ proxmox_locale }}
  ansible.builtin.shell: |
    ssh root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }} 'bash -c "
      echo \"LANG={{ proxmox_locale }}\" > /etc/default/locale
      echo \"LC_ALL={{ proxmox_locale }}\" >> /etc/default/locale
      echo \"LANGUAGE={{ proxmox_locale }}\" >> /etc/default/locale
    "'
  changed_when: true

- name: PROXMOX INIT - RUN LOCALE-GEN {{ proxmox_locale }}
  ansible.builtin.shell: >
    ssh root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
    "locale-gen {{ proxmox_locale }} 2>/dev/null || true"
  changed_when: true
