---
################################################################################
# workspace.credentials — default variables
################################################################################

# deployer-cli user (required)
DEPLOYER_CLI_USER: "to_define"

# infrastructure identification (required)
INFRASTRUCTURE_CODENAME: "to_define"
INFRASTRUCTURE_SCENARIO: "to_define"

# workspace directory (required)
DEPLOYER_CLI__DST_CONFIG_DIR: "/home/{{ DEPLOYER_CLI_USER }}/range42.config/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}"

# local source directories (required — where credentials.generate wrote the files)
INFRASTRUCTURE__AUTO_GENERATED__SSH_KEYS_DIR_LOCAL: "to_define"
INFRASTRUCTURE__AUTO_GENERATED__CONFIG_DIR_LOCAL: "to_define"

# ssh keys destination directories on deployer-cli
DEPLOYER_CLI__DST_SSH_CONFIG_RANGE42_KEYS_DIR: "/home/{{ DEPLOYER_CLI_USER }}/.ssh/range42/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}"
DEPLOYER_CLI__DST_SSH_KEYS_BACKEND_DEST_DIR: "{{ DEPLOYER_CLI__DST_SSH_CONFIG_RANGE42_KEYS_DIR }}/backend_keys"
DEPLOYER_CLI__DST_SSH_KEYS_JUMP_DEST_DIR: "{{ DEPLOYER_CLI__DST_SSH_CONFIG_RANGE42_KEYS_DIR }}/jump_keys"
DEPLOYER_CLI__DST_SSH_KEYS_STUDENT_DEST_DIR: "{{ DEPLOYER_CLI__DST_SSH_CONFIG_RANGE42_KEYS_DIR }}/student_keys"
