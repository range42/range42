---
# credentials generate - generate or import vm user passwords (alice, bob, wazuh)
# and the wazuh manager secrets (agent enrollment, api users wazuh and wazuh-wui)
#
# if auto-generate == YES : generate random 32-char passwords
# if auto-generate == NO  : use values from inventory/vault (must be provided)

- name: CREDENTIALS GENERATE - AUTO-GENERATE VM USER PASSWORDS
  ansible.builtin.set_fact:
    generated_admin_password: "{{ lookup('community.general.random_string', length=32, override_special='_-') }}"
    generated_trainee_password: "{{ lookup('community.general.random_string', length=32, override_special='_-') }}"
    # wazuh requires: 8-64 chars, upper+lower+number+symbol(.*+?-)
    # we use a safe subset: inject -_ at fixed positions to guarantee symbol presence
    generated_wazuh_password: "{{ lookup('community.general.random_string', length=28, override_special='_-') }}-R42_"
    # wazuh manager api: 8-64 chars, lower+upper+digit+non-alphanumeric ; the fixed suffix
    # guarantees all four (the enrollment password uses the same rule)
    generated_wazuh_authd_password: "{{ lookup('community.general.random_string', length=28, override_special='_-') }}-Ae5"
    generated_wazuh_api_password: "{{ lookup('community.general.random_string', length=28, override_special='_-') }}-Ap6"
    generated_wazuh_wui_password: "{{ lookup('community.general.random_string', length=28, override_special='_-') }}-Wu8"
  when: context_auto_generate_vm_passwords | default('YES') | upper == 'YES'
  no_log: true

- name: CREDENTIALS GENERATE - USE PASSWORDS FROM INVENTORY (AUTO-GENERATE DISABLED)
  ansible.builtin.set_fact:
    generated_admin_password: "{{ default_admin_vm_ci_password }}"
    generated_trainee_password: "{{ default_trainee_vm_ci_password }}"
    generated_wazuh_password: "{{ WAZUH_PASSWORD }}"
    generated_wazuh_authd_password: "{{ infrastructure_wazuh_authd_password }}"
    generated_wazuh_api_password: "{{ infrastructure_wazuh_api_password }}"
    generated_wazuh_wui_password: "{{ infrastructure_wazuh_wui_password }}"
  when: context_auto_generate_vm_passwords | default('YES') | upper != 'YES'
  no_log: true

# the wazuh api policy, in the charset the windows agent role accepts on the msiexec command line ;
# the condition text is printed on failure, never the values
- name: CREDENTIALS GENERATE - CHECK IMPORTED WAZUH ENROLLMENT AND API PASSWORDS
  ansible.builtin.assert:
    that:
      - generated_wazuh_authd_password is match('^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[_-])[A-Za-z0-9_-]{20,64}$')
      - generated_wazuh_api_password is match('^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[_-])[A-Za-z0-9_-]{20,64}$')
      - generated_wazuh_wui_password is match('^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[_-])[A-Za-z0-9_-]{20,64}$')
    fail_msg: >-
      infrastructure_wazuh_authd_password, infrastructure_wazuh_api_password and
      infrastructure_wazuh_wui_password must be 20 to 64 characters of a-z A-Z 0-9 - _ with at
      least one upper case letter, one lower case letter, one digit and one - or _
    quiet: true
  when: context_auto_generate_vm_passwords | default('YES') | upper != 'YES'
