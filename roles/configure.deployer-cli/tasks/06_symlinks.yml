- name: configure symlinks - warmup
  block:
    #
    - name: configure symlinks warmup - mkdir -p {{ DEPLOYER_CLI__DST_CONFIG_DIR }}
      ansible.builtin.file:
        path: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}"
        state: directory
        owner: "{{ DEPLOYER_CLI_USER }}"
        group: "{{ DEPLOYER_CLI_USER }}"
        mode: "0755"
      become: true

- name: configure symlinks - warmup
  block:
    #
    - name: configure symlinks warmup - mkdir -p {{ DEPLOYER_CLI__DST_CONFIG_DIR }}/ssh_keys
      ansible.builtin.file:
        path: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/ssh_keys"
        state: directory
        owner: "{{ DEPLOYER_CLI_USER }}"
        group: "{{ DEPLOYER_CLI_USER }}"
        mode: "0700"
      become: true

- name: configure symlinks - warmup
  block:
    #
    - name: configure symlinks warmup - mkdir -p {{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets"
      ansible.builtin.file:
        path: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets"
        state: directory
        owner: "{{ DEPLOYER_CLI_USER }}"
        group: "{{ DEPLOYER_CLI_USER }}"
        mode: "0700"
      become: true

- name: configure symlinks
  # become: true
  # become_user: "{{ DEPLOYER_CLI_USER }}"

  block:
    #
    - name: configure symlinks - create secrets symlink to range42-ansible_roles-debug-devkit
      file:
        src: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets"
        dest: "{{ DEPLOYER_CLI__DST_GIT_DIR }}/range42-ansible_roles-debug-devkit/secrets"
        state: link
        force: yes

    - name: bug_fix - remove existing demo_lab secrets dir
      file:
        path: "{{ DEPLOYER_CLI__DST_GIT_DIR }}/range42-playbooks/scenarios/demo_lab/secrets"
        state: absent

    - name: configure symlinks - create secrets range42-playbooks/scenarios/demo_lab
      file:
        src: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets"
        dest: "{{ DEPLOYER_CLI__DST_GIT_DIR }}/range42-playbooks/scenarios/demo_lab/secrets"
        state: link
        force: yes

    # - name: configure symlinks - create inventory range42-playbooks/scenarios/demo_lab/inventory
    #   file:
    #     src: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/inventory"
    #     dest: "{{ DEPLOYER_CLI__DST_GIT_DIR }}/range42-playbooks/scenarios/demo_lab/inventory"
    #     state: link
    #     force: yes

- name: DEBUG TASK

  block:
    # =>> ansible.builtin.copy: will not accept encrypted vault copy.
    #
    # - name: copy secrets dir  - DEBUG TEMP TASK
    #   ansible.builtin.copy:
    #     src: secrets/
    #     dest: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets"
    #     mode: "0600"
    #     directory_mode: "0700"
    #
    # =>> ansible.builtin.copy: will not accept encrypted vault copy.
    #
    # - name: copy secrets directory as-is (vault-safe)
    #   ansible.builtin.synchronize:
    #     src: "{{ role_path }}/files/secrets/"
    #     dest: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets/"
    #     recursive: true
    #     delete: false
    #
    # This work but will be deprecated in ansible version 2.19
    #

    #
    # workaround :
    #

    - name: archive secrets directory (vault-safe)
      ansible.builtin.archive:
        path: "{{ role_path }}/files/secrets/"
        dest: "/tmp/secrets.tar.gz"
      delegate_to: localhost
      become: false # we don't sudo on localhost.

    - name: copy secrets archive to remote
      ansible.builtin.copy:
        src: "/tmp/secrets.tar.gz"
        dest: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets.tar.gz"
        mode: "0600"

    - name: extract secrets archive
      ansible.builtin.unarchive:
        src: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets.tar.gz"
        dest: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets/"
        remote_src: true

    # - name: cleanup secrets archive
    #   ansible.builtin.file:
    #     path: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets.tar.gz"
    #     state: absent

    - name: copy ssh keys dir -  DEBUG TEMP TASK
      ansible.builtin.copy:
        src: "ssh_keys/"
        dest: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/ssh_keys"
        mode: "0600"
        directory_mode: "0700"
