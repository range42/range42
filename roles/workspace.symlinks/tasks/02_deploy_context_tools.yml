---
# workspace symlinks - deploy context tools (workspace_utils.sh, unlock-sshkeys.sh)
#
# TODO: these will be replaced by range42-context (Phase 4, T44-T47)
# kept for now as transitional tools
#
# source: configure.deployer-cli/tasks/10_context_tools.yml

- name: WORKSPACE SYMLINKS - GENERATE WORKSPACE_UTILS.SH FROM TEMPLATE
  ansible.builtin.template:
    src: remote-deployer-cli-change_context.j2
    dest: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/workspace_utils.sh"
    owner: "{{ DEPLOYER_CLI_USER }}"
    group: "{{ DEPLOYER_CLI_USER }}"
    mode: "0700"

- name: WORKSPACE SYMLINKS - CREATE SYMLINK TO WORKSPACE_UTILS.SH IN BIN
  ansible.builtin.file:
    src: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/workspace_utils.sh"
    dest: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/bin/workspace_utils.sh"
    state: link
    force: true

- name: WORKSPACE SYMLINKS - GENERATE UNLOCK-SSHKEYS.SH FROM TEMPLATE
  ansible.builtin.template:
    src: unlock-sshkeys.j2
    dest: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/bin/unlock-sshkeys.sh"
    owner: "{{ DEPLOYER_CLI_USER }}"
    group: "{{ DEPLOYER_CLI_USER }}"
    mode: "0700"
