---
################################################################################
# workspace.symlinks
#
# Create symlinks that connect git repos to the active workspace.
#
# Runs on: deployer-cli (SSH)
# Idempotent: yes (force: yes overwrites existing symlinks)
#
# Extracted from: configure.deployer-cli tasks:
#   - 06_symlinks.yml           → 00_symlink_secrets.yml
#   - 10_context_tools.yml      → 01_symlink_scenario.yml
#                               → 02_deploy_context_tools.yml
#
# Requires: deployer.repos (git repos cloned), workspace.init (directories exist)
#
# Symlinks created:
#   - range42-ansible_roles-debug-devkit/secrets → config_dir/secrets
#   - range42-playbooks/scenarios/SCENARIO/secrets → config_dir/secrets
#   - config_dir/scenario → range42-playbooks/scenarios/SCENARIO
#   - config_dir/bin/workspace_utils.sh → config_dir/workspace_utils.sh
#
# Variables consumed:
#   - DEPLOYER_CLI_USER
#   - DEPLOYER_CLI__DST_GIT_DIR
#   - DEPLOYER_CLI__DST_CONFIG_DIR
#   - INFRASTRUCTURE_CODENAME, INFRASTRUCTURE_SCENARIO
#
################################################################################

- import_tasks: ./00_symlink_secrets.yml
- import_tasks: ./01_symlink_scenario.yml
- import_tasks: ./02_deploy_context_tools.yml
