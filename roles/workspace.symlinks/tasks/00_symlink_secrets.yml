---
# workspace symlinks - create secrets symlinks in git repos
#
# links secrets/ in repos to the workspace config_dir/secrets/
# note: these symlinks point to the LAST deployed CODENAME-SCENARIO
#       the context switch tool (range42-context) handles switching at runtime
#
# source: configure.deployer-cli/tasks/06_symlinks.yml (lines 44-63)

- name: WORKSPACE SYMLINKS - REMOVE EXISTING SECRETS DIR IN PLAYBOOKS REPO
  ansible.builtin.file:
    path: "{{ DEPLOYER_CLI__DST_GIT_DIR }}/range42-playbooks/scenarios/{{ INFRASTRUCTURE_SCENARIO }}/secrets"
    state: absent

- name: WORKSPACE SYMLINKS - CREATE SECRETS SYMLINK IN DEBUG-DEVKIT REPO
  ansible.builtin.file:
    src: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets"
    dest: "{{ DEPLOYER_CLI__DST_GIT_DIR }}/range42-ansible_roles-debug-devkit/secrets"
    state: link
    force: true

- name: WORKSPACE SYMLINKS - CREATE SECRETS SYMLINK IN PLAYBOOKS REPO
  ansible.builtin.file:
    src: "{{ DEPLOYER_CLI__DST_CONFIG_DIR }}/secrets"
    dest: "{{ DEPLOYER_CLI__DST_GIT_DIR }}/range42-playbooks/scenarios/{{ INFRASTRUCTURE_SCENARIO }}/secrets"
    state: link
    force: true
