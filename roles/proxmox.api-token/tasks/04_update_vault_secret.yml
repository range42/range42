---
# proxmox api-token - update vault with the token secret
#
# the vault is created by playbook 01 with proxmox_api_token_secret: ""
# after token creation in playbook 02, we need to inject the real secret
#
# flow: decrypt vault → update token_secret line → re-encrypt

- name: PROXMOX API-TOKEN - LOCATE VAULT FILE
  ansible.builtin.set_fact:
    _vault_file: "{{ DEPLOYER_CLI_ROOT_DIR }}/config/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}/secrets/default_vault.yml"
    _vault_pass_file: "{{ DEPLOYER_CLI_ROOT_DIR }}/config/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}/secrets/vault_pass.txt"

- name: PROXMOX API-TOKEN - CHECK VAULT FILE EXISTS
  ansible.builtin.stat:
    path: "{{ _vault_file }}"
  register: vault_file_check

- name: PROXMOX API-TOKEN - UPDATE VAULT WITH TOKEN SECRET
  when:
    - vault_file_check.stat.exists
    - proxmox_api_token_secret_result is defined
    - proxmox_api_token_secret_result | length > 0
  block:
    - name: PROXMOX API-TOKEN - DECRYPT VAULT
      ansible.builtin.command: >
        ansible-vault decrypt "{{ _vault_file }}"
        --vault-password-file "{{ _vault_pass_file }}"
      changed_when: true
      failed_when: false

    - name: PROXMOX API-TOKEN - INJECT TOKEN SECRET IN VAULT
      ansible.builtin.lineinfile:
        path: "{{ _vault_file }}"
        regexp: '^proxmox_api_token_secret:'
        line: 'proxmox_api_token_secret: "{{ proxmox_api_token_secret_result }}"'
      no_log: true

    - name: PROXMOX API-TOKEN - RE-ENCRYPT VAULT
      ansible.builtin.command: >
        ansible-vault encrypt "{{ _vault_file }}"
        --vault-password-file "{{ _vault_pass_file }}"
      changed_when: true

    - name: PROXMOX API-TOKEN - VAULT UPDATED
      ansible.builtin.debug:
        msg: "token secret saved to vault: {{ _vault_file }}"
