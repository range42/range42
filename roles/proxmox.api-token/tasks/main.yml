---
################################################################################
# proxmox.api-token
#
# Create or import Proxmox API user, token, and ACL. Then test the token.
#
# Runs on: localhost (uses ssh commands via root@proxmox + curl for API test)
# Requires: proxmox.init completed (root SSH key access working)
#
# Source: prepare-infrastructure-workspace.sh
#   - proxmox_generate_api_credentials()  (lines 984-1162)
#   - proxmox_api_call_test()             (lines 1167-1219)
#
# What this role does:
#   1. Create PVE user (pveum user add) if it doesn't exist
#   2. Create range42-operator custom role (least-privilege, skip if exists)
#   3. Check if API token already exists (pveum user token list)
#   4. If token exists → use secret from config (or parent_config)
#   5. If token does not exist → create it (pveum user token add --privsep 0)
#   6. Grant range42-operator ACL on / — revoke Administrator first (migration)
#   7. Test the API token via curl (GET /api2/json/nodes)
#
# Variables consumed:
#   - INFRASTRUCTURE_PROXMOX_ADDRESS       (required)
#   - proxmox_api_user                     (required — e.g. "api_master01@pam")
#   - proxmox_api_token_id                 (required — e.g. "api_master01")
#   - proxmox_api_token_secret             (optional — imported if token exists)
#   - proxmox_api_host                     (required — host:port for API test)
#
# Facts set:
#   - proxmox_api_token_secret_result      ← the token secret (new or imported)
#
################################################################################

- import_tasks: ./00_create_api_user.yml
- import_tasks: ./00_create_operator_role.yml
- import_tasks: ./01_create_or_import_token.yml
- import_tasks: ./02_grant_acl.yml
- import_tasks: ./03_test_api_token.yml
- import_tasks: ./04_update_vault_secret.yml
