---
# credentials vault - generate vault password and write vault_pass.txt
#
# vault_pass.txt is intentional by design — it stays on disk
# (clean_up_secret defaults to NO)

- name: CREDENTIALS VAULT - CHECK IF VAULT_PASS.TXT ALREADY EXISTS
  ansible.builtin.stat:
    path: "{{ vault_output_dir }}/vault_pass.txt"
  register: vault_pass_check

- name: CREDENTIALS VAULT - GENERATE VAULT PASSWORD
  ansible.builtin.set_fact:
    vault_password: "{{ lookup('community.general.random_string', length=32, override_special='_-') }}"
  when: not vault_pass_check.stat.exists
  no_log: true

- name: CREDENTIALS VAULT - READ EXISTING VAULT PASSWORD
  ansible.builtin.slurp:
    src: "{{ vault_output_dir }}/vault_pass.txt"
  register: vault_pass_existing
  when: vault_pass_check.stat.exists
  no_log: true

###
###
###

- name: CREDENTIALS VAULT - SET VAULT PASSWORD FROM EXISTING FILE
  ansible.builtin.set_fact:
    vault_password: "{{ vault_pass_existing.content | b64decode | trim }}"
  when: vault_pass_check.stat.exists
  no_log: true

###
###
###

- name: CREDENTIALS VAULT - WRITE VAULT_PASS.TXT
  ansible.builtin.copy:
    content: "{{ vault_password }}\n"
    dest: "{{ vault_output_dir }}/vault_pass.txt"
    mode: "0600"
  when: not vault_pass_check.stat.exists
  no_log: true
