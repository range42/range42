---
# deployer bootstrap - configure apt proxy on the deployer-cli (optional)
#
# Sets /etc/apt/apt.conf.d/00range42-proxy if apt_proxy_url is non-empty.
# Removes it otherwise (idempotent, supports unsetting).
#
# Must run BEFORE 01_packages.yml so apt-get installs use the proxy.

- name: DEPLOYER BOOTSTRAP - CONFIGURE APT PROXY (apt_proxy_url is set)
  ansible.builtin.copy:
    content: |
      Acquire::http::Proxy "{{ apt_proxy_url }}";
    dest: /etc/apt/apt.conf.d/00range42-proxy
    owner: root
    group: root
    mode: "0644"
  when: apt_proxy_url is defined and (apt_proxy_url | length) > 0
  become: true
  # NOTE: only HTTP is proxified. apt-cacher-ng (and most local apt caches) don't
  # pass-through HTTPS by default — setting an https proxy on a non-HTTPS-capable
  # cacher breaks `apt update` for sources using https://. HTTPS goes DIRECT.

- name: DEPLOYER BOOTSTRAP - REMOVE APT PROXY (apt_proxy_url is empty/unset)
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/00range42-proxy
    state: absent
  when: apt_proxy_url is not defined or (apt_proxy_url | length) == 0
  become: true
