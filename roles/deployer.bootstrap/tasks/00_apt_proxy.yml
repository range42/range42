---
# deployer bootstrap - configure apt proxy on the deployer-cli (optional)
#
# Sets /etc/apt/apt.conf.d/00range42-proxy if apt_proxy_url is non-empty.
# Removes it otherwise (idempotent, supports unsetting).
#
# When apt_mirror_enabled is true the proxy points to the local mirror VM.
# The deployer may not have a direct network route to the mirror (e.g. mirror
# is on vmbr142 admin zone, deployer is on a different subnet). The probe
# therefore goes via SSH through Proxmox: SSH to root@PROXMOX, then nc from
# there — the same path used by all other plays in site.yml.
#   - reachable  → configure proxy normally
#   - unreachable → skip proxy, warn, fall back to direct apt
# Re-running deployer.bootstrap after the mirror VM is deployed will pick it up.
#
# Must run BEFORE 01_packages.yml so apt-get installs use the proxy.

- name: DEPLOYER BOOTSTRAP - PROBE APT MIRROR VIA PROXMOX SSH (skip if mirror disabled)
  ansible.builtin.shell: >
    ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5
    -i {{ DEPLOYER_CLI_ROOT_DIR | default(playbook_dir + '/..') }}/config/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}/ssh_keys/jump_keys/px.{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}-ssh_cli.root
    root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
    "nc -z -w3 {{ apt_mirror_vm_ip | default('192.168.142.50') }} {{ apt_mirror_port | default(3142) | int }}"
  register: _apt_mirror_probe
  when:
    - apt_mirror_enabled | default(false) | bool
    - apt_proxy_url is defined and (apt_proxy_url | length) > 0
  ignore_errors: true
  changed_when: false

- name: DEPLOYER BOOTSTRAP - RESOLVE MIRROR REACHABILITY FLAG
  ansible.builtin.set_fact:
    _apt_mirror_unreachable: >-
      {{
        (_apt_mirror_probe is defined)
        and not (_apt_mirror_probe.skipped | default(false))
        and (_apt_mirror_probe.failed | default(false))
      }}

- name: DEPLOYER BOOTSTRAP - WARN APT MIRROR NOT REACHABLE (using direct apt)
  ansible.builtin.debug:
    msg: >-
      APT mirror at {{ apt_proxy_url }} is not reachable yet (mirror VM not deployed).
      Skipping proxy — apt will use direct internet for this bootstrap.
      Re-run site.yml or deployer.bootstrap after deploying the apt mirror VM.
  when: _apt_mirror_unreachable | bool

- name: DEPLOYER BOOTSTRAP - CONFIGURE APT PROXY (apt_proxy_url is set and reachable)
  ansible.builtin.copy:
    content: |
      Acquire::http::Proxy "{{ apt_proxy_url }}";
    dest: /etc/apt/apt.conf.d/00range42-proxy
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - apt_proxy_url is defined and (apt_proxy_url | length) > 0
    - not (_apt_mirror_unreachable | default(false) | bool)
  # NOTE: only HTTP is proxified. apt-cacher-ng (and most local apt caches) don't
  # pass-through HTTPS by default — setting an https proxy on a non-HTTPS-capable
  # cacher breaks `apt update` for sources using https://. HTTPS goes DIRECT.

- name: DEPLOYER BOOTSTRAP - REMOVE APT PROXY (apt_proxy_url is empty/unset or mirror unreachable)
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/00range42-proxy
    state: absent
  become: true
  when: >-
    (apt_proxy_url is not defined or (apt_proxy_url | length) == 0)
    or (_apt_mirror_unreachable | default(false) | bool)
