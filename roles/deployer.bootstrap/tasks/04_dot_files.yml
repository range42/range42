---
# deployer bootstrap - deploy dotfiles (vimrc, zshrc) for deployer user and root
#
# vimrc : a plain copy, nothing is ever injected into it.
# zshrc : a MANAGED BLOCK (04_zshrc_managed_block.yml), because two roles inject
#         blocks into this file behind the base configuration (RANGE42 CONTEXT,
#         one RANGE42 ENV per workspace) and the operator may add settings too.
#         The former copy rewrote the whole file at every deploy and erased them.
#
# source: configure.deployer-cli/tasks/03_dot_files.yml

- name: DEPLOYER BOOTSTRAP - DEPLOY VIMRC FOR DEPLOYER USER
  ansible.builtin.copy:
    src: dot_files/vimrc
    dest: "/home/{{ DEPLOYER_CLI_USER }}/.vimrc"
    owner: "{{ DEPLOYER_CLI_USER }}"
    group: "{{ DEPLOYER_CLI_USER }}"
    mode: "0644"

- name: DEPLOYER BOOTSTRAP - MANAGE ZSHRC FOR DEPLOYER USER
  ansible.builtin.include_tasks: ./04_zshrc_managed_block.yml
  vars:
    _zshrc_path: "/home/{{ DEPLOYER_CLI_USER }}/.zshrc"
    _zshrc_owner: "{{ DEPLOYER_CLI_USER }}"
    _zshrc_become: false

- name: DEPLOYER BOOTSTRAP - DEPLOY VIMRC FOR ROOT
  ansible.builtin.copy:
    src: dot_files/vimrc
    dest: "/root/.vimrc"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: DEPLOYER BOOTSTRAP - MANAGE ZSHRC FOR ROOT
  ansible.builtin.include_tasks: ./04_zshrc_managed_block.yml
  vars:
    _zshrc_path: /root/.zshrc
    _zshrc_owner: root
    _zshrc_become: true
