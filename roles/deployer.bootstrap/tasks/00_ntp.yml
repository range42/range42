---
# deployer bootstrap - configure ntp (systemd-timesyncd) and wait for sync
#
# removes legacy ntp/ntpdate, installs systemd-timesyncd, waits for clock sync
# important for vm usage / revert to snapshot scenarios
#
# source: configure.deployer-cli/tasks/01_packages.yml (lines 4-58)

- name: DEPLOYER BOOTSTRAP - REMOVE LEGACY NTP PACKAGES
  ansible.builtin.apt:
    name:
      - ntp
      - ntpdate
    state: absent
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - DEV_MODE_INSTALL_JUMP_HOST_ANSIBLE_PACKAGES | default('YES') | upper != 'NO'

- name: DEPLOYER BOOTSTRAP - INSTALL SYSTEMD-TIMESYNCD
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - DEV_MODE_INSTALL_JUMP_HOST_ANSIBLE_PACKAGES | default('YES') | upper != 'NO'

- name: DEPLOYER BOOTSTRAP - ENABLE AND START SYSTEMD-TIMESYNCD
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - DEV_MODE_INSTALL_JUMP_HOST_ANSIBLE_PACKAGES | default('YES') | upper != 'NO'

