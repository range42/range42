---
################################################################################
# workspace.ssh-config — default variables
################################################################################

# deployer-cli user (required)
DEPLOYER_CLI_USER: "to_define"

# infrastructure identification (required)
INFRASTRUCTURE_CODENAME: "to_define"
INFRASTRUCTURE_SCENARIO: "to_define"
INFRASTRUCTURE_PROXMOX_ADDRESS: "to_define"

# ssh directories and files
DEPLOYER_CLI__DST_SSH_CONFIG_DIR: "/home/{{ DEPLOYER_CLI_USER }}/.ssh"
DEPLOYER_CLI__DST_SSH_CONFIG_DEFAULT_FILE: "{{ DEPLOYER_CLI__DST_SSH_CONFIG_DIR }}/config"
DEPLOYER_CLI__DST_SSH_CONFIG_RANGE42_KEYS_DIR: "{{ DEPLOYER_CLI__DST_SSH_CONFIG_DIR }}/range42/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}"
DEPLOYER_CLI__DST_SSH_CONFIG_RANGE42_FILE: "{{ DEPLOYER_CLI__DST_SSH_CONFIG_DIR }}/config_range42-{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}"

# ssh key destination directories
DEPLOYER_CLI__DST_SSH_KEYS_BACKEND_DEST_DIR: "{{ DEPLOYER_CLI__DST_SSH_CONFIG_RANGE42_KEYS_DIR }}/backend_keys"
DEPLOYER_CLI__DST_SSH_KEYS_JUMP_DEST_DIR: "{{ DEPLOYER_CLI__DST_SSH_CONFIG_RANGE42_KEYS_DIR }}/jump_keys"
DEPLOYER_CLI__DST_SSH_KEYS_STUDENT_DEST_DIR: "{{ DEPLOYER_CLI__DST_SSH_CONFIG_RANGE42_KEYS_DIR }}/student_keys"

# scenario templates directory on the CONTROLLER (operator's local clone)
# the template module reads `src` on the controller, not on the target —
# this path must always resolve to the operator's sibling range42-playbooks clone.
SCENARIO_TEMPLATES_DIR: "{{ playbook_dir }}/../../range42-playbooks/scenarios/{{ INFRASTRUCTURE_SCENARIO }}/templates"
