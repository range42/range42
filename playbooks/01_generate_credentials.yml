---
################################################################################
# 01 — Generate credentials (SSH keys, passwords, vault)
#
# Runs entirely on localhost — no remote connection needed.
#
# Usage:
#   ansible-playbook playbooks/01_generate_credentials.yml \
#     -i inventories/<your-codename>/hosts.yml \
#     -e INFRASTRUCTURE_SCENARIO=demo_lab
#
# Produces:
#   config/<CODENAME>-<SCENARIO>/ssh_keys/   (all SSH keys)
#   config/<CODENAME>-<SCENARIO>/secrets/     (encrypted vault + vault_pass.txt)
#   config/<CODENAME>-<SCENARIO>/summary.txt  (workspace orientation, non-secret)
#
################################################################################

- name: 01 generate credentials - ssh keys and passwords
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    DEPLOYER_CLI_ROOT_DIR: "{{ playbook_dir }}/.."
    credentials_output_dir: "{{ DEPLOYER_CLI_ROOT_DIR }}/config/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}"
    vault_output_dir: "{{ DEPLOYER_CLI_ROOT_DIR }}/config/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}/secrets"

  roles:
    - credentials.generate
    - credentials.vault
