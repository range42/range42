---
################################################################################
# 04 — Configure apt mirror VM
#
# No-op when apt_mirror_enabled is false.
#
# Play 04a (localhost): resolve credential paths and register the mirror VM
#   in a dynamic inventory group (apt_mirror_dynamic) so play 04b can
#   connect. SSH jumps through root@proxmox via ProxyCommand because the VM
#   is on a private network (192.168.142.x).
#
# Play 04b (apt_mirror_dynamic): install and configure the mirror software
#   (apt-cacher-ng in proxy mode, apt-mirror+nginx in airgapped mode).
#   Runs with become:true (requires alice sudo access from cloud-init).
#
# Play 04c (localhost / Proxmox): ensure ip_forward is on and an iptables
#   FORWARD rule allows all lab subnets (192.168.0.0/16) to reach the
#   apt-mirror VM on the HTTP port. Saves rules via iptables-persistent.
#   Without this, lab VMs cannot reach the mirror across bridges.
#
# Requires: 02b_apt_mirror_vm.yml completed (VM is running, SSH is up).
# Requires: 01_generate_credentials.yml completed (alice key exists).
#
################################################################################

- name: 04a apt mirror - register dynamic inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    DEPLOYER_CLI_ROOT_DIR: "{{ playbook_dir }}/.."
    _credentials_dir: "{{ DEPLOYER_CLI_ROOT_DIR }}/config/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}"
    _root_key_path: "{{ _credentials_dir }}/ssh_keys/jump_keys/px.{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}-ssh_cli.root"
    _alice_key_path: "{{ _credentials_dir }}/ssh_keys/backend_keys/r42.{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}-deployer-key_alice"

  tasks:
    - name: APT MIRROR CONFIG - SKIP PLAY (apt_mirror_enabled is false)
      ansible.builtin.meta: end_play
      when: not apt_mirror_enabled | default(false) | bool

    - name: APT MIRROR CONFIG - REGISTER DYNAMIC HOST
      ansible.builtin.add_host:
        name: apt-mirror-dynamic
        groups: apt_mirror_dynamic
        ansible_host: "{{ apt_mirror_vm_ip }}"
        ansible_user: alice
        ansible_ssh_private_key_file: "{{ _alice_key_path }}"
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o BatchMode=yes
          -o ProxyCommand='ssh -o StrictHostKeyChecking=no -o BatchMode=yes
          -i {{ _root_key_path }}
          -W %h:%p
          root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}'
      changed_when: false

- name: 04b apt mirror - install and configure apt-cacher-ng
  hosts: apt_mirror_dynamic
  gather_facts: true
  become: true

  roles:
    - apt-mirror.configure

- name: 04c apt mirror - configure Proxmox forwarding so lab VMs can reach the mirror
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _root_key_path: "{{ playbook_dir }}/../config/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}/ssh_keys/jump_keys/px.{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}-ssh_cli.root"
    _mirror_ip: "{{ apt_mirror_vm_ip | default('192.168.142.50') }}"
    _mirror_port: "{{ apt_mirror_http_port | default(80) if apt_mirror_airgapped | default(false) | bool else apt_mirror_port | default(3142) }}"
    _comment: "r42: lab to apt-mirror"

  tasks:
    - name: APT MIRROR PROXMOX FWD - SKIP (apt_mirror_enabled is false)
      ansible.builtin.meta: end_play
      when: not apt_mirror_enabled | default(false) | bool

    - name: APT MIRROR PROXMOX FWD - ensure ip_forward is enabled
      ansible.builtin.shell: >
        ssh -i {{ _root_key_path }} -o StrictHostKeyChecking=no -o BatchMode=yes
        root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
        "sysctl -w net.ipv4.ip_forward=1 &&
        echo 'net.ipv4.ip_forward=1' > /etc/sysctl.d/99-range42-forward.conf"
      changed_when: false

    - name: APT MIRROR PROXMOX FWD - add FORWARD rule (idempotent)
      ansible.builtin.shell: >
        ssh -i {{ _root_key_path }} -o StrictHostKeyChecking=no -o BatchMode=yes
        root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
        "iptables -C FORWARD -d {{ _mirror_ip }}/32 -p tcp --dport {{ _mirror_port }}
        -m comment --comment '{{ _comment }}' -j ACCEPT 2>/dev/null ||
        iptables -I FORWARD 2 -d {{ _mirror_ip }}/32 -p tcp --dport {{ _mirror_port }}
        -m comment --comment '{{ _comment }}' -j ACCEPT"
      changed_when: false

    - name: APT MIRROR PROXMOX FWD - persist rules via iptables-persistent
      ansible.builtin.shell: >
        ssh -i {{ _root_key_path }} -o StrictHostKeyChecking=no -o BatchMode=yes
        root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}
        "iptables-save > /etc/iptables/rules.v4"
      changed_when: false
