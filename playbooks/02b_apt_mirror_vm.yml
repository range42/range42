---
################################################################################
# 02b — Provision apt mirror VM on Proxmox
#
# No-op when apt_mirror_enabled is false.
# Runs from localhost after 02_configure_proxmox.yml (root SSH key is loaded).
#
# What this playbook does:
#   0. If template apt_mirror_vm_template_id is missing on Proxmox:
#        a. Download Debian Trixie genericcloud qcow2 (if not already present)
#        b. Create VM, import disk, configure scsi/cloudinit/boot/serial
#        c. Convert to template
#   1. Clone template apt_mirror_vm_template_id → apt_mirror_vm_id
#   2. Set cloud-init (IP, gateway, alice user, SSH key)
#   3. Start the VM and wait for SSH readiness on port 22
#
# Uses raw SSH qm/pvesh commands (no external Ansible roles required —
# range42-ansible_roles-proxmox_controller is not yet cloned at this stage).
#
# After this playbook:
#   - VM apt_mirror_vm_id (admin-apt-mirror) is running at apt_mirror_vm_ip
#   - SSH is reachable via jump through root@proxmox
#   - 04_configure_apt_mirror.yml can proceed to install apt-cacher-ng
#
################################################################################

- name: 02b provision apt mirror VM
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    DEPLOYER_CLI_ROOT_DIR: "{{ playbook_dir }}/.."
    _credentials_dir: "{{ DEPLOYER_CLI_ROOT_DIR }}/config/{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}"
    _root_key_path: "{{ _credentials_dir }}/ssh_keys/jump_keys/px.{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}-ssh_cli.root"
    _alice_pubkey_path: "{{ _credentials_dir }}/ssh_keys/backend_keys/r42.{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}-deployer-key_alice.pub"
    _mirror_vm_ip: "{{ apt_mirror_vm_ip | default('192.168.142.50') }}"
    _mirror_vm_id: "{{ apt_mirror_vm_id | default(1050) }}"
    _mirror_template_id: "{{ apt_mirror_vm_template_id | default(9301) }}"
    _apt_mirror_gw: "{{ _mirror_vm_ip | regex_replace('^(\\d+\\.\\d+\\.\\d+)\\.\\d+$', '\\1.1') }}"
    _ssh_px: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i {{ _root_key_path }} root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}"
    _mirror_template_name: "{{ apt_mirror_vm_template_name | default('template-vm-small-debian-trixie') }}"
    _mirror_cloud_img: "debian-13-genericcloud-amd64.qcow2"
    _mirror_cloud_img_url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    _mirror_cloud_img_path: "/var/lib/vz/template/iso/debian-13-genericcloud-amd64.qcow2"
    _mirror_cloud_img_sums_url: "{{ _mirror_cloud_img_url | regex_replace('/[^/]+$', '/SHA512SUMS') }}"
    _mirror_disk_size: "{{ apt_mirror_vm_disk_size | default('32G') }}"

  pre_tasks:
    - name: APT MIRROR VM - SKIP PLAY (apt_mirror_enabled is false)
      ansible.builtin.meta: end_play
      when: not apt_mirror_enabled | default(false) | bool

    - name: APT MIRROR VM - CHECK SSH-AGENT IS RUNNING
      ansible.builtin.command: ssh-add -l
      register: _agent_check
      changed_when: false
      failed_when: false

    - name: APT MIRROR VM - START SSH-AGENT IF NEEDED
      ansible.builtin.shell: |
        ssh-agent -s | head -2
      register: _agent_start
      when: _agent_check.rc == 2
      changed_when: _agent_start is not skipped

    - name: APT MIRROR VM - SET SSH_AUTH_SOCK FACT (NEW AGENT)
      ansible.builtin.set_fact:
        _ssh_auth_sock: "{{ _agent_start.stdout | regex_search('SSH_AUTH_SOCK=([^;]+)', '\\1') | first }}"
      when: _agent_check.rc == 2

    - name: APT MIRROR VM - SET SSH_AUTH_SOCK FACT (EXISTING AGENT)
      ansible.builtin.set_fact:
        _ssh_auth_sock: "{{ lookup('env', 'SSH_AUTH_SOCK') }}"
      when: _agent_check.rc != 2

  environment:
    SSH_AUTH_SOCK: "{{ _ssh_auth_sock | default(lookup('env', 'SSH_AUTH_SOCK')) }}"

  tasks:
    - name: APT MIRROR VM - CHECK IF TEMPLATE {{ _mirror_template_id }} EXISTS
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qm list | awk '{print \$1}' | grep -qx {{ _mirror_template_id }} && echo exists || echo not_exists"
      register: _mirror_template_check
      changed_when: false

    - name: APT MIRROR VM - DOWNLOAD DEBIAN TRIXIE CLOUD IMAGE (if not present)
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "test -f {{ _mirror_cloud_img_path }} ||
        (wget -q -O {{ _mirror_cloud_img_path }}.tmp {{ _mirror_cloud_img_url }}
        && mv {{ _mirror_cloud_img_path }}.tmp {{ _mirror_cloud_img_path }})"
      when: _mirror_template_check.stdout | trim == 'not_exists'
      changed_when: true
      async: 600
      poll: 10

    - name: APT MIRROR VM - VERIFY CLOUD IMAGE SHA512 CHECKSUM
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "cd /var/lib/vz/template/iso &&
        wget -q -O /tmp/r42_trixie_SHA512SUMS {{ _mirror_cloud_img_sums_url }} &&
        sha512sum --check --ignore-missing /tmp/r42_trixie_SHA512SUMS ;
        RET=$? ; rm -f /tmp/r42_trixie_SHA512SUMS ; exit $RET"
      when: _mirror_template_check.stdout | trim == 'not_exists'
      changed_when: false

    - name: APT MIRROR VM - CREATE TEMPLATE VM {{ _mirror_template_id }}
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qm create {{ _mirror_template_id }}
        --name {{ _mirror_template_name }}
        --memory 4096 --cores 1 --sockets 1 --cpu host
        --net0 virtio,bridge=vmbr140"
      when: _mirror_template_check.stdout | trim == 'not_exists'
      changed_when: true

    - name: APT MIRROR VM - PRE-RESIZE CLOUD IMAGE TO {{ _mirror_disk_size }}
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qemu-img resize --shrink {{ _mirror_cloud_img_path }} {{ _mirror_disk_size }}"
      when: _mirror_template_check.stdout | trim == 'not_exists'
      changed_when: true

    - name: APT MIRROR VM - IMPORT CLOUD DISK TO TEMPLATE VM
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qm disk import {{ _mirror_template_id }}
        {{ _mirror_cloud_img_path }}
        {{ infrastructure_proxmox_dest_vm_storage_name }}"
      when: _mirror_template_check.stdout | trim == 'not_exists'
      changed_when: true

    - name: APT MIRROR VM - CONFIGURE TEMPLATE DISK, CLOUD-INIT, BOOT, AND SERIAL
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qm set {{ _mirror_template_id }}
        --scsihw virtio-scsi-pci
        --scsi0 {{ infrastructure_proxmox_dest_vm_storage_name }}:vm-{{ _mirror_template_id }}-disk-0
        --ide2 {{ infrastructure_proxmox_dest_vm_storage_name }}:cloudinit,media=cdrom
        --boot c --bootdisk scsi0
        --serial0 socket --vga serial0"
      when: _mirror_template_check.stdout | trim == 'not_exists'
      changed_when: true

    - name: APT MIRROR VM - CONVERT VM {{ _mirror_template_id }} TO TEMPLATE
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qm template {{ _mirror_template_id }}"
      when: _mirror_template_check.stdout | trim == 'not_exists'
      changed_when: true

    - name: APT MIRROR VM - TAG TEMPLATE {{ _mirror_template_id }} AS 'template'
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "pvesh set /nodes/{{ proxmox_node }}/qemu/{{ _mirror_template_id }}/config
        --tags template 2>/dev/null || true"
      when: _mirror_template_check.stdout | trim == 'not_exists'
      changed_when: true

    - name: APT MIRROR VM - TEMPLATE {{ _mirror_template_id }} READY
      ansible.builtin.debug:
        msg: "Template {{ _mirror_template_id }} ({{ _mirror_template_name }}) created on Proxmox"
      when: _mirror_template_check.stdout | trim == 'not_exists'

    - name: APT MIRROR VM - CHECK IF VM {{ _mirror_vm_id }} ALREADY EXISTS
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qm list | awk '{print \$1}' | grep -qx {{ _mirror_vm_id }} && echo exists || echo not_exists"
      register: _mirror_vm_check
      changed_when: false

    - name: APT MIRROR VM - ALREADY EXISTS (skipping clone)
      ansible.builtin.debug:
        msg: "VM {{ _mirror_vm_id }} (admin-apt-mirror) already exists — skipping clone and cloud-init"
      when: _mirror_vm_check.stdout | trim == 'exists'

    - name: APT MIRROR VM - CLONE TEMPLATE {{ _mirror_template_id }} → {{ _mirror_vm_id }}
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qm clone {{ _mirror_template_id }} {{ _mirror_vm_id }}
        --name admin-apt-mirror
        --full 1
        --storage {{ infrastructure_proxmox_dest_vm_storage_name }}"
      when: "'not_exists' in _mirror_vm_check.stdout"
      changed_when: true

    - name: APT MIRROR VM - UPLOAD ALICE PUBLIC KEY TO PROXMOX
      ansible.builtin.shell: >-
        scp -o StrictHostKeyChecking=no -o BatchMode=yes
        -i {{ _root_key_path }}
        {{ _alice_pubkey_path }}
        root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}:/tmp/r42_mirror_pubkey.txt
      when: "'not_exists' in _mirror_vm_check.stdout"
      changed_when: true

    - name: APT MIRROR VM - APPLY CLOUD-INIT (IP, gateway, user, SSH key)
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qm set {{ _mirror_vm_id }}
        --net0 virtio,bridge={{ vm_net_virtio_bridge | default('vmbr142') }}
        --ipconfig0 ip={{ _mirror_vm_ip }}/24,gw={{ _apt_mirror_gw }}
        --ciuser alice
        --sshkeys /tmp/r42_mirror_pubkey.txt &&
        qm cloudinit update {{ _mirror_vm_id }} 2>/dev/null || true ;
        rm -f /tmp/r42_mirror_pubkey.txt"
      when: "'not_exists' in _mirror_vm_check.stdout"
      changed_when: true

    - name: APT MIRROR VM - TAG AS 'admin'
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "pvesh set /nodes/{{ proxmox_node }}/qemu/{{ _mirror_vm_id }}/config
        --tags admin 2>/dev/null || true"
      when: "'not_exists' in _mirror_vm_check.stdout"
      changed_when: true

    # Always refresh sshkeys on Proxmox so the current deployer-cli alice key is
    # authoritative in cloud-init metadata (guards against key mismatch when the
    # VM was originally provisioned from a different machine).
    - name: APT MIRROR VM - UPLOAD ALICE PUBLIC KEY (always, for key freshness)
      ansible.builtin.shell: >-
        scp -o StrictHostKeyChecking=no -o BatchMode=yes
        -i {{ _root_key_path }}
        {{ _alice_pubkey_path }}
        root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}:/tmp/r42_mirror_pubkey.txt
      changed_when: true

    - name: APT MIRROR VM - UPDATE CLOUD-INIT SSHKEYS (always)
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qm set {{ _mirror_vm_id }}
        --sshkeys /tmp/r42_mirror_pubkey.txt &&
        qm cloudinit update {{ _mirror_vm_id }} 2>/dev/null || true ;
        rm -f /tmp/r42_mirror_pubkey.txt"
      changed_when: true

    # For already-running VMs cloud-init won't re-run, so inject the key directly
    # via SSH from localhost (connection: local) using a ProxyCommand through root@proxmox.
    # Best-effort: if the VM has a stale alice key this will fail gracefully.
    - name: APT MIRROR VM - PUSH ALICE KEY INTO authorized_keys (live VM, best-effort)
      ansible.builtin.shell: |
        set -e
        ALICE_PUB=$(cat {{ _alice_pubkey_path }})
        ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o IdentitiesOnly=yes \
          -o "ProxyCommand=ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i {{ _root_key_path }} -W %h:%p root@{{ INFRASTRUCTURE_PROXMOX_ADDRESS }}" \
          -i {{ _alice_key_path }} \
          alice@{{ _mirror_vm_ip }} \
          "mkdir -p ~/.ssh && echo \"$ALICE_PUB\" >> ~/.ssh/authorized_keys && sort -u ~/.ssh/authorized_keys > /tmp/r42_ak_tmp && mv /tmp/r42_ak_tmp ~/.ssh/authorized_keys"
      vars:
        _alice_key_path: "{{ _credentials_dir }}/ssh_keys/backend_keys/r42.{{ INFRASTRUCTURE_CODENAME }}-{{ INFRASTRUCTURE_SCENARIO }}-deployer-key_alice"
      changed_when: false
      failed_when: false

    - name: APT MIRROR VM - START VM {{ _mirror_vm_id }} (skip if already running)
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "qm status {{ _mirror_vm_id }} | grep -q running || qm start {{ _mirror_vm_id }}"
      register: _mirror_start
      changed_when: _mirror_start.stdout | length > 0

    - name: APT MIRROR VM - WAIT FOR SSH ON {{ _mirror_vm_ip }}:22 (up to 120s via Proxmox)
      ansible.builtin.shell: >
        {{ _ssh_px }}
        "timeout 120 bash -c
        'until nc -z -w2 {{ _mirror_vm_ip }} 22 2>/dev/null; do sleep 3; done && echo ready'
        || echo timeout"
      register: _mirror_ssh_wait
      changed_when: false
      failed_when: "'timeout' in _mirror_ssh_wait.stdout"

    - name: APT MIRROR VM - READY
      ansible.builtin.debug:
        msg: >-
          VM {{ _mirror_vm_id }} (admin-apt-mirror) is up at {{ _mirror_vm_ip }}:22.
          Play 04 will install and configure apt-cacher-ng.
